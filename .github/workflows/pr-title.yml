name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Conventional Commit format
        env:
          # Passed through the environment so the title is never interpreted as shell code.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*[^.]$'
          # GitHub's Revert button titles pull requests 'Revert "<original title>"'.
          revert_pattern='^Revert ".+"$'
          if [[ "$TITLE" =~ $pattern || "$TITLE" =~ $revert_pattern ]]; then
            echo "Title OK: $TITLE"
          else
            echo "::error::PR title must look like 'fix(claude): short imperative description' (no trailing period). See CONTRIBUTING.md."
            echo "Got: $TITLE"
            exit 1
          fi
